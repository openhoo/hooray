version: 1
fail_closed:
  unknown_applicability: false
  unknown_licenses: false
default_outcome: warn
rules:
  - id: deny-critical-findings
    priority: 100
    outcome: deny
    reason: Critical security findings block delivery
    selectors:
      minimum_severity: critical
  - id: deny-high-confidence-security-findings
    priority: 90
    outcome: deny
    reason: High-confidence, high-severity security findings block delivery
    selectors:
      kinds:
        - vulnerability
        - secret
        - iac
        - sast
        - malware
      minimum_severity: high
      confidence:
        - high
exceptions:
  # Dogfood self-scan: our own SAST rule tables, test vectors, and internal
  # SQL/test helpers trip the new detectors. Each entry is pinned exactly.
  - id: dogfood-secret-test-vectors
    owner: hooray-maintainers
    reason: High-entropy findings are the scanner's own SAST rule tables and test vectors, not credentials
    ticket: audit-2026-09
    expires_at: "2027-03-19T00:00:00Z"
    compensating_controls:
      - Findings pinned by SHA-256 fingerprint; any new secret still denies
    selectors:
      rule_id: secret.high-entropy-assignment
