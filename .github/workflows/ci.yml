name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_DENY_VERSION: "0.19.8"
  CARGO_LLVM_COV_VERSION: "0.8.7"
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Lint commit messages
        uses: openhoo/hooversion/actions/lint@ac503b23b9b36ebbf39ee6103713c81f1f18b64d # v1.1.1
        with:
          version: 1.1.1

      - name: Cache Rust dependencies and tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-llvm-cov
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/advisory-db
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-deny-${{ env.CARGO_DENY_VERSION }}-llvm-cov-${{ env.CARGO_LLVM_COV_VERSION }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Install cargo-deny when uncached or stale
        run: |
          if ! command -v cargo-deny >/dev/null || [ "$(cargo-deny --version)" != "cargo-deny $CARGO_DENY_VERSION" ]; then
            cargo install cargo-deny --locked --force --version "$CARGO_DENY_VERSION"
          fi

      - name: Install cargo-llvm-cov 0.8.7 when needed
        run: |
          if ! command -v cargo-llvm-cov >/dev/null || [ "$(cargo-llvm-cov --version)" != "cargo-llvm-cov $CARGO_LLVM_COV_VERSION" ]; then
            cargo install cargo-llvm-cov --locked --force --version "$CARGO_LLVM_COV_VERSION"
          fi

      - name: Install LLVM coverage tools
        run: rustup component add llvm-tools-preview

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Enforce line coverage
        run: cargo llvm-cov --locked --all-targets --all-features --fail-under-lines 90

      - name: Check dependency policy
        run: cargo deny check advisories bans licenses sources

      - name: Build Hooray action executable
        run: cargo build --locked --bin hooray

      - name: Dogfood Hooray action
        uses: ./actions/scan
        with:
          executable: ./target/debug/hooray
          policy: hooray-policy.yaml
          format: table
          output: ""

      - name: Enforce Hoolicy policy
        uses: openhoo/hoolicy/actions/check@46529a99335938e7284f11099bf15f7e1800e6f5 # v0.3.1
        with:
          version: 0.3.1

      - name: Analyze with Hoonarqube
        uses: openhoo/hoonarqube/actions/analyze@11e4d2d44f5e34d11a7c03e4a87eea857ceea8ed # v0.3.0
        with:
          version: 0.3.0
          paths: |
            src
            tests
            benches
          output: ${{ runner.temp }}/hoonarqube.json
          fail-on: none

      - name: Set up HooNeedsUpdates
        uses: openhoo/hooneedsupdates/actions/setup@ffd31b013dafcd772bb067a0eec76f739ecd76a3 # v0.3.1
        with:
          version: 0.3.1

      - name: Audit dependency freshness
        run: hooneedsupdates scan --fail-on unresolved .
        env:
          GITHUB_TOKEN: ${{ github.token }}
