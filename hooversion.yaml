branches:
  - main
packages:
  - name: hooray
    path: .
    type: rust
    manifest: Cargo.toml
    changelog: CHANGELOG.md
    scopes:
      - hooray
hooks:
  afterVersion:
    - scripts/sync-action-versions.sh
    # Update the root version while retaining the reviewed dependency graph.
    - cargo update --workspace
github:
  releases: true
