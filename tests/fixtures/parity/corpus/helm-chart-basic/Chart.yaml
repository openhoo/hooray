apiVersion: v2
name: demo-stack
description: A demo Helm chart with legacy pinned dependencies
type: application
version: 1.2.3
appVersion: "1.0.0"
dependencies:
  - name: postgresql
    version: "9.8.0"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
    tags:
      - database
  - name: redis
    version: "10.5.7"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
