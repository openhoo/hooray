name: Setup Hooray
description: Download a verified Hooray release binary and add it to PATH.
inputs:
  version:
    description: Hooray release version to install.
    required: false
    default: "0.6.1"
outputs:
  version:
    description: Hooray version configured by this action.
    value: ${{ steps.install.outputs.version }}
runs:
  using: composite
  steps:
    - name: Download and install Hooray
      id: install
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        RUNNER_OS_VALUE: ${{ runner.os }}
        RUNNER_ARCH_VALUE: ${{ runner.arch }}
      run: bash "$GITHUB_ACTION_PATH/install.sh"
