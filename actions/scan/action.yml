name: Scan with Hooray
description: "Install Hooray, validate policy, and scan a project with an isolated database."
inputs:
  version:
    description: "Hooray release version to install."
    required: false
    default: "0.9.0"
  executable:
    description: "Optional Hooray executable path; skips release installation when set."
    required: false
    default: ""
  working-directory:
    description: "Repository directory where Hooray should run."
    required: false
    default: "."
  input:
    description: "Project path to scan, relative to the working directory."
    required: false
    default: "."
  config:
    description: "Optional Hooray configuration path."
    required: false
    default: ""
  policy:
    description: "Hooray policy path."
    required: false
    default: "hooray-policy.yaml"
  offline:
    description: "Disable OSV network access while retaining local analysis."
    required: false
    default: "false"
  format:
    description: "Hooray report format."
    required: false
    default: "sarif"
  fail-on-policy:
    description: "Fail the action on policy denial; false never suppresses operational failures."
    required: false
    default: "true"
  summary:
    description: "Append a policy and finding summary to the GitHub job summary."
    required: false
    default: "true"
  additional-formats:
    description: "Comma-separated additional reports rendered from the same persisted run."
    required: false
    default: ""
  output:
    description: "Report output path."
    required: false
    default: "hooray.sarif"
outputs:
  report:
    description: "Configured report path, available only after the current report is written."
    value: ${{ steps.scan.outputs.report }}
  exit-code:
    description: "Action exit status: 0 passed or explicitly permitted denial, 1 policy denial, 2 operational failure."
    value: ${{ steps.scan.outputs.exit-code }}
  scan-exit-code:
    description: "Original scanner exit status; empty when scanning did not start."
    value: ${{ steps.scan.outputs.scan-exit-code }}
  policy-status:
    description: "passed, denied, or error. Error includes validation and report publication failures."
    value: ${{ steps.scan.outputs.policy-status }}
  run-id:
    description: "Persisted run identifier, available after the scan and history are validated."
    value: ${{ steps.scan.outputs.run-id }}
  database:
    description: "Isolated SQLite database path for later report or integration export commands in this job."
    value: ${{ steps.scan.outputs.database }}
  artifacts-directory:
    description: "Directory containing additional reports from the persisted run."
    value: ${{ steps.scan.outputs.artifacts-directory }}
  reports:
    description: "JSON object mapping report formats to successfully produced report paths."
    value: ${{ steps.scan.outputs.reports }}
  allowed:
    description: "Number of allow policy decisions."
    value: ${{ steps.scan.outputs.allowed }}
  warned:
    description: "Number of warn policy decisions."
    value: ${{ steps.scan.outputs.warned }}
  denied:
    description: "Number of deny policy decisions."
    value: ${{ steps.scan.outputs.denied }}
  finding-count:
    description: "Number of findings in the persisted run."
    value: ${{ steps.scan.outputs.finding-count }}
runs:
  using: composite
  steps:
    - name: Install pinned Cosign verifier
      if: ${{ inputs.executable == '' }}
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Set up Hooray
      if: ${{ inputs.executable == '' }}
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        RUNNER_OS_VALUE: ${{ runner.os }}
        RUNNER_ARCH_VALUE: ${{ runner.arch }}
      run: bash "$GITHUB_ACTION_PATH/../setup/install.sh"

    - name: Validate policy and scan project
      id: scan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_ADDITIONAL_FORMATS: ${{ inputs.additional-formats }}
        INPUT_FAIL_ON_POLICY: ${{ inputs.fail-on-policy }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_EXECUTABLE: ${{ inputs.executable }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_PATH: ${{ inputs.input }}
        INPUT_OFFLINE: ${{ inputs.offline }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_POLICY: ${{ inputs.policy }}
      run: |
        set -euo pipefail

        # Initialize outputs even when validation or the CLI fails before scan.
        scan_exit=""
        policy_status=error
        database_dir=""
        metadata_file=""
        support="$GITHUB_ACTION_PATH/support.py"
        finish() {
          status=$?
          trap - EXIT
          if [[ "$status" != 0 && "$status" != 1 ]]; then status=2; fi
          if [[ "$status" == 2 ]]; then policy_status=error; fi
          if [[ -n "$metadata_file" && -f "$metadata_file" ]]; then
            if ! python3 "$support" finish "$metadata_file" "$policy_status" "$status" "$scan_exit"; then
              status=2
              policy_status=error
            fi
          fi
          printf 'exit-code=%s\nscan-exit-code=%s\npolicy-status=%s\n' \
            "$status" "$scan_exit" "$policy_status" >> "$GITHUB_OUTPUT" || status=2
          exit "$status"
        }
        trap finish EXIT
        printf 'report=\nrun-id=\ndatabase=\nartifacts-directory=\nreports={}\nallowed=\nwarned=\ndenied=\nfinding-count=\n' >> "$GITHUB_OUTPUT"

        for pair in "offline:$INPUT_OFFLINE" "fail-on-policy:$INPUT_FAIL_ON_POLICY" "summary:$INPUT_SUMMARY"; do
          name="${pair%%:*}"
          value="${pair#*:}"
          if [[ "$value" != true && "$value" != false ]]; then
            echo "::error::${name} must be true or false."
            exit 2
          fi
        done
        # Inputs enter argument arrays through environment variables, never
        # interpolated expressions or eval. Reject option/newline injection.
        for pair in \
          "input:$INPUT_PATH" "policy:$INPUT_POLICY" "config:$INPUT_CONFIG" \
          "format:$INPUT_FORMAT" "output:$INPUT_OUTPUT" \
          "executable:$INPUT_EXECUTABLE" "additional-formats:$INPUT_ADDITIONAL_FORMATS"; do
          name="${pair%%:*}"
          value="${pair#*:}"
          if [[ "$value" == -* || "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
            echo "::error::${name} must not start with '-' or contain newlines."
            exit 2
          fi
        done
        if [[ -z "$INPUT_POLICY" || -z "$INPUT_PATH" || -z "$INPUT_FORMAT" ]]; then
          echo "::error::A policy path, input path and report format are required."
          exit 2
        fi
        if ! command -v python3 >/dev/null; then
          echo "::error::The Hooray scan action requires Python 3."
          exit 2
        fi
        python3 "$support" validate

        database_dir="$(mktemp -d "${RUNNER_TEMP}/hooray-database.XXXXXXXX")"
        metadata_file="$database_dir/action-metadata.json"
        export HOORAY_DATABASE_PATH="${database_dir}/hooray.db"
        export HOORAY_OFFLINE="$INPUT_OFFLINE"
        printf 'database=%s\n' "$HOORAY_DATABASE_PATH" >> "$GITHUB_OUTPUT"

        hooray_command=(hooray)
        if [[ -n "$INPUT_EXECUTABLE" ]]; then hooray_command=("$INPUT_EXECUTABLE"); fi
        global=()
        if [[ -n "$INPUT_CONFIG" ]]; then global+=(--config "$INPUT_CONFIG"); fi
        # CLI text can include repository-controlled content. Keep it visible
        # without permitting that content to create GitHub workflow commands.
        run_hooray() {
          marker="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          printf '::stop-commands::%s\n' "$marker"
          command_status=0
          "${hooray_command[@]}" "${global[@]}" "$@" || command_status=$?
          printf '::%s::\n' "$marker"
          return "$command_status"
        }
        if ! run_hooray policy validate "$INPUT_POLICY"; then
          echo "::error::Hooray policy validation failed."
          exit 2
        fi

        args=(scan project "$INPUT_PATH" --policy "$INPUT_POLICY" --format "$INPUT_FORMAT")
        if [[ -n "$INPUT_OUTPUT" ]]; then
          if [[ "$INPUT_FORMAT" == gitlab-artifacts ]]; then
            # The CLI publishes bundles atomically with no-clobber semantics.
            args+=(--output "$INPUT_OUTPUT")
          else
            args+=(--output "$database_dir/primary")
          fi
        fi
        scan_exit=0
        run_hooray "${args[@]}" || scan_exit=$?
        if [[ "$scan_exit" != 0 && "$scan_exit" != 1 ]]; then
          echo "::error::Hooray scan failed operationally."
          exit 2
        fi
        # This database was created for one scan only: list exactly one run,
        # then reuse its stable ID for every additional report, without rescans.
        if ! run_hooray history list --limit 1 --format json --output "$database_dir/history.json"; then
          echo "::error::Could not read the persisted Hooray run."
          exit 2
        fi
        python3 "$support" metadata "$database_dir/history.json" "$metadata_file" "$scan_exit"
        run_id="$(cat "$database_dir/run-id")"
        if [[ "$scan_exit" == 1 ]]; then policy_status=denied; else policy_status=passed; fi

        if [[ -n "$INPUT_OUTPUT" ]]; then
          if [[ "$INPUT_FORMAT" == gitlab-artifacts ]]; then
            python3 "$support" register "$metadata_file" "$INPUT_OUTPUT" "$INPUT_FORMAT" primary
          else
            python3 "$support" publish "$metadata_file" "$database_dir/primary" "$INPUT_OUTPUT" "$INPUT_FORMAT"
          fi
        fi
        if [[ -n "$INPUT_ADDITIONAL_FORMATS" ]]; then
          mkdir "$database_dir/reports"
          IFS=',' read -r -a formats <<< "$INPUT_ADDITIONAL_FORMATS"
          for format in "${formats[@]}"; do
            case "$format" in
              json|spdx|gitlab-code-quality) extension=json ;;
              yaml) extension=yaml ;;
              table) extension=txt ;;
              sarif|gitlab-sarif) extension=sarif ;;
              junit) extension=xml ;;
              html) extension=html ;;
              cyclonedx-vex|cyclone-dx-vex|gitlab-cyclonedx) extension=cdx.json ;;
              json-lines) extension=jsonl ;;
              csv) extension=csv ;;
              markdown) extension=md ;;
              gitlab-artifacts) extension=bundle ;;
            esac
            destination="$database_dir/reports/hooray.$format.$extension"
            report_exit=0
            run_hooray report "$run_id" --format "$format" --output "$destination" || report_exit=$?
            if [[ "$report_exit" != "$scan_exit" ]]; then
              echo "::error::An additional report failed or disagreed with the scan policy outcome."
              exit 2
            fi
            python3 "$support" register "$metadata_file" "$destination" "$format"
          done
        fi
        if [[ "$scan_exit" == 1 && "$INPUT_FAIL_ON_POLICY" == true ]]; then exit 1; fi
